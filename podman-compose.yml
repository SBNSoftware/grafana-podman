version: "3.7"
services:
  graphite:
    image: docker.io/graphiteapp/graphite-statsd:${GRAPHITE_VERSION}
    container_name: graphite
    ports:
      - "${BIND_IP}:${GRAPHITE_PORT}:80"
      - "127.0.0.1:${GRAPHITE_PORT}:80"
      - "${BIND_IP}:${CARBON_PICKLE_PORT}:${CARBON_PICKLE_PORT}"
      - "127.0.0.1:${CARBON_PICKLE_PORT}:${CARBON_PICKLE_PORT}"
    environment:
      - GRAPHITE_STORAGE_DIR=/data
    volumes:
      - ${GRAPHITE_STORAGE_DIR}:/data:Z
      - ${GRAPHITE_CONFIG_DIR}:/opt/graphite/conf:ro
      - ${LOGS_DIR}:/var/log/graphite:Z
    restart: always
    deploy:
      resources:
        limits:
          memory: ${GRAPHITE_MEMORY_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - ./grafana-service.env

  grafana:
    image: docker.io/grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    ports:
      - "${BIND_IP}:${GRAFANA_PORT}:3000"
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/admin_password
    secrets:
      - admin_password
    volumes:
      - ${GRAFANA_DATA_DIR}:/var/lib/grafana:Z
      - ${LOGS_DIR}:/var/log/grafana:Z
    restart: always
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - ./grafana-service.env

  nginx:
    image: docker.io/library/nginx:${NGINX_VERSION}
    container_name: nginx
    ports:
      - "${BIND_IP}:${NGINX_PORT}:443"
      - "127.0.0.1:${NGINX_PORT}:443"
    volumes:
      - ${NGINX_CONF_DIR}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${NGINX_CERTS_DIR}:/etc/nginx/certs:ro
      - ${LOGS_DIR}:/var/log/nginx:Z
    restart: always
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT}
    depends_on:
      - grafana
      - graphite
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "3"
        compress: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:443"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
      - ./grafana-service.env

  dozzle:
    image: docker.io/amir20/dozzle:${DOZZLE_VERSION}
    container_name: dozzle
    volumes:
      - ${PODMAN_SOCK}:/var/run/docker.sock:ro
      - ${LOGS_DIR}:/var/log/dozzle:Z
    ports:
      - "${BIND_IP}:${DOZZLE_PORT}:8080"
    restart: always
    deploy:
      resources:
        limits:
          memory: ${DOZZLE_MEMORY_LIMIT}
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "3"
        compress: "true"
    env_file:
      - ./grafana-service.env

secrets:
  admin_password:
    file: ./admin_password.txt
