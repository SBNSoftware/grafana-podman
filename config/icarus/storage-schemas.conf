# Schema definitions for Whisper files. Entries are scanned in order,
# and first match wins. This file is scanned for changes every 60 seconds.
#
#  [name]
#  pattern = regex
#  retentions = timePerPoint:timeToStore, timePerPoint:timeToStore, ...

# Carbon's internal metrics. This entry should match what is specified in
# CARBON_METRIC_PREFIX and CARBON_METRIC_INTERVAL settings
[carbon]
pattern = ^carbon\.
retentions = 60:90d

[icarus_run_numbers]
pattern = run_number$
retentions = 15s:1d,60s:3d,2m:14d,10m:12w

[icarus_tpc_temps]
pattern = Temp1$
retentions = 15s:1d,60s:3d,2m:14d,10m:12w

[icarus_pmt_Temps]
pattern= ^icarus\.icaruspmt.*\.CAENV1730.*\.Temp$
retentions = 60s:1d,2m:7d

[icarus_pmt_MemoryFull]
pattern= ^icarus\.icaruspmt.*\.CAENV1730.*\.MemoryFull$
retentions = 60s:1d,2m:7d

[icarus_pmt_Missing_Fragments]
pattern = ^icarus\.icaruspmt.*\.Missing_Fragments$
retentions = 60s:1d,2m:7d

[icarus_pmt_Average_Fragment_Size]
pattern =  ^icarus\.icaruspmt.*\.Average_Fragment_Size$
retentions = 60s:1d,2m:7d

[default]
pattern = .*
retentions = 60s:1d
